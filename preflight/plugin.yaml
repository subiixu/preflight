name: preflight
title: Preflight
summary: Checks your whole app before launch, then says if you're cleared to ship
author: Subaz
version: 0.2.1
icon: AirplaneTakeOff01Icon
logo: logo.svg
category: feedback-testing
needs:
  araniko: ">=2.18.0"
settings:
  - key: audience
    label: Who will use it
    type: choice
    options: [Just me and my team, The public]
    default: The public
  - key: depth
    label: How deep to check
    type: choice
    options: [Quick, Thorough]
    default: Thorough
screens:
  - id: preflight
    place: project-tab
    title: Preflight
    icon: AirplaneTakeOff01Icon
    entry: screens/preflight/index.html
can:
  send_briefs: true
  storage: true
  files: read        # read the report Nayo writes in .araniko/plugins/preflight/
